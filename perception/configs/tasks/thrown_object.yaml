# The V57 simulation contract owns robot reset and ballistic task geometry.
# alpha_0_5 is the only currently commissioned stage: all eight target-center
# corners are visible in the fixed 424x240 camera.  alpha_1_0 extends outside
# the image and must remain fail-closed until the camera/task geometry changes.
simulation_task_contract_file: ../../v57_real_test_reset_and_throw_ranges.yaml
simulation_task_contract_sha256: 7d0646b1a1592895aeb0a7f591d65d771eb6b67cf14154d4aab1b54b0609f4c4
simulation_curriculum: alpha_0_5
# Camera/SAM initialization is completed before this gate.  A stable held
# object first enters PREPARING while both robot owners are still closed.  The
# runtime then starts measured/static holds and performs one discarded policy
# warmup.  Only after those steps does ARMED tell the operator to throw; the
# exact motion/entry frame then releases the first policy tick.  A timeout can
# stop the owners but can never emit a policy-derived command.
rollout_trigger:
  enabled: true
  mode: object_motion_or_entry
  maximum_wait_s: 12.0
  poll_interval_s: 0.001
  minimum_mask_area_px: 20
  absent_arm_frames: 3
  stable_arm_frames: 3
  stable_max_centroid_speed_px_s: 80.0
  trigger_min_centroid_speed_px_s: 120.0
  trigger_min_displacement_px: 6.0
  minimum_area_ratio: 0.25
  maximum_area_ratio: 4.0
config_overrides:
  camera:
    serial: '342222071785'
    width: 424
    height: 240
    fps: 60
    # The D435 stereo pair otherwise integrates for about 8.5 ms on auto.
    # At throw speed that smears the projected texture by several pixels and
    # produced 100+ ms runs with no measured target depth.  RGB remains auto.
    depth_auto_exposure: false
    depth_exposure: 2000
    depth_gain: 32
    laser_power: 360
    max_color_depth_timestamp_skew_s: 0.007
    z_min: 0.25
    # The commissioned catch box reaches camera z=1.191 m and a thrown
    # object's far surface plus D435 edge noise needs additional headroom.
    # The V57 alpha_0_5 target-center box reaches camera z=1.505 m and its
    # largest object support reaches about 1.547 m.  Use 1.65 m for bounded
    # measurement headroom; robot-facing admissibility remains the separately
    # sealed V57 robot_base target box.
    # Robot-facing admissibility remains the separate robot_base catch box.
    z_max: 1.65
    emitter: true
    preset: default
    spatial_filter: false
    temporal_filter: false
    hole_filter: false
  pointcloud:
    workspace_min: null
    workspace_max: null
    support_plane_abcd: null
    support_plane_min_clearance_m: 0.0
    center_policy_points: false
    # The RGB mask remains exact-current.  When D435 stereo temporarily has
    # fewer than 16 valid object pixels, translate only the most recent
    # measured cloud to that current mask.  Never compound predicted clouds.
    temporal_fallback: motion_compensated
    temporal_fallback_max_stale_s: 0.25
    temporal_fallback_max_stale_steps: 5
    temporal_fallback_max_image_speed_px_s: 2400.0
  extrinsics:
    calibration_file: calibrations/fr3_d435_342222071785_eye_to_hand_424x240_60hz_reuse_v1.yaml
    require_calibration: true
    require_quality_pass: true
    strict_camera_serial: true
  prompting:
    # Publish the first clipped entry immediately, then allow at most two
    # exact 20 Hz observations to replace its provisional SAM2 identity with
    # a geometrically continuous, more complete bbox.  This is a one-shot
    # startup refinement, not periodic re-grounding.
    boundary_entry_refinement_enabled: true
    boundary_entry_refinement_max_ticks: 2
    boundary_entry_refinement_max_center_step_ratio: 0.25
    boundary_entry_refinement_min_area_ratio: 0.35
    boundary_entry_refinement_max_area_ratio: 4.0
    boundary_entry_refinement_min_inward_step_px: 1.0
    boundary_entry_refinement_min_area_growth_ratio: 1.05
    # A clipped first view may contain too little target appearance and let a
    # long hand-held phase contaminate temporal identity.  During only the
    # first 0.5 s, inspect every second 20 Hz tick and allow one strong,
    # interior, physically continuous text detection to atomically reseed
    # SAM2.  There is no periodic detector after this startup transaction.
    startup_semantic_confirmation_enabled: true
    startup_semantic_confirmation_min_elapsed_s: 0.0
    startup_semantic_confirmation_max_ticks: 10
    startup_semantic_confirmation_search_every_ticks: 2
    startup_semantic_confirmation_min_detector_score: 0.10
    startup_semantic_confirmation_max_center_speed_px_s: 600.0
    startup_semantic_confirmation_min_area_ratio: 0.35
    startup_semantic_confirmation_max_area_ratio: 4.0
    startup_semantic_confirmation_interior_margin_px: 1
  online_sam2:
    # Thrown deployment may consume the exact-current semantic mask for the
    # bounded point-cloud fallback.  It is deliberately non-authoritative and
    # cannot update guarded_v2 identity/recovery history by itself.
    policy_current_semantic_mask_enabled: true
  runtime:
    publish_zmq: false
    max_packet_hz: 20
    min_packet_hz: 20

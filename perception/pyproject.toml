[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-object-pcd"
version = "0.1.0"
description = "Real-time object partial point cloud provider for dynamic grasping with D435, ROI tracking, optional SAM2, and policy IPC."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dynamic Manipulation" }]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "pyrealsense2>=2.54",
  "open3d>=0.17",
  "PyYAML>=6.0",
  "pyzmq>=25.0",
]

[tool.setuptools.packages.find]
include = ["dynamic_pcd*"]
